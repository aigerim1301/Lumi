services:
  - type: web
    name: lumi-survey
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: "bash build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: BRAND_NAME
        value: "Lumi"
      - key: TIME_ZONE
        value: "Asia/Bishkek"
